UI menu.c32
PROMPT 0
MENU TITLE Lukearch (Arch-based, unofficial)
TIMEOUT 50
DEFAULT lukearch

LABEL lukearch
  MENU LABEL Boot Lukearch (x86_64)
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% systemd.firstboot=off

LABEL lukearch_copytoram
  MENU LABEL Boot Lukearch (x86_64, copy to RAM)
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram systemd.firstboot=off

# mkarchiso copies the memtest86+ package's BIOS binary here.
LABEL memtest
  MENU LABEL Run Memtest86+ (RAM test)
  LINUX /boot/memtest86+/memtest
