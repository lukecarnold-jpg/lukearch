name: Validate project skeleton

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate shell syntax
        run: |
          set -euo pipefail
          bash -n scripts/build-iso.sh
          bash -n scripts/test-iso.sh
          bash -n profile/profiledef.sh
          bash -n profile-aarch64/profiledef.sh
          bash -n profile-aarch64/airootfs/root/customize_airootfs.sh
          bash -n scripts/test-virtualbox.sh
          bash -n scripts/update-structure.sh
          bash -n scripts/test-install.sh
          bash -n scripts/test-install-guest.sh
          bash -n profile/airootfs/root/customize_airootfs.sh
          bash -n profile/airootfs/usr/local/bin/lukearch-install
          bash -n profile-aarch64/airootfs/usr/local/bin/lukearch-install
          bash -n profile/airootfs/usr/local/bin/lukearch-install-launcher
          sh -n profile/airootfs/usr/local/sbin/lukearch-set-admin-password

      - name: Lint shell scripts
        run: |
          set -euo pipefail
          shellcheck -s bash scripts/*.sh profile*/profiledef.sh profile*/airootfs/root/customize_airootfs.sh \
            profile*/airootfs/usr/local/bin/lukearch-install profile*/airootfs/usr/local/bin/lukearch-install-launcher
          shellcheck -s sh profile*/airootfs/usr/local/sbin/lukearch-set-admin-password

      - name: Check files shared by both profiles are identical
        run: |
          set -euo pipefail
          shared=(
            etc/hostname
            etc/locale.conf
            etc/locale.gen
            etc/nftables.conf
            etc/os-release
            etc/pam.d/su
            etc/sudoers.d/lukearch
            etc/systemd/system/pacman-init.service
            etc/systemd/zram-generator.conf
            usr/local/bin/lukearch-install
            usr/local/bin/lukearch-install-launcher
            usr/local/sbin/lukearch-set-admin-password
            usr/share/applications/lukearch-install.desktop
          )
          for file in "${shared[@]}"; do
            cmp "profile/airootfs/$file" "profile-aarch64/airootfs/$file"
          done

      - name: Test installer settings handling
        run: |
          set -euo pipefail
          installer=profile/airootfs/usr/local/bin/lukearch-install
          tmp="$(mktemp -d)"
          # Runs a dry run that must fail, and checks its output for a message.
          expect_rejected() { # file message
            local out
            if out="$("$installer" --config "$1" --dry-run 2>&1)"; then
              echo "dry run accepted $1" >&2
              exit 1
            fi
            grep -qF "$2" <<<"$out" || { echo "missing message: $2" >&2; echo "$out" >&2; exit 1; }
          }
          "$installer" --print-config > "$tmp/settings.conf"
          grep -qx 'INSTALL_MODE=wipe' "$tmp/settings.conf"
          grep -qx 'FILESYSTEM=ext4' "$tmp/settings.conf"
          # The recommended settings still need a disk.
          expect_rejected "$tmp/settings.conf" 'Choose the disk to erase.'
          printf 'NOPE=1\n' > "$tmp/unknown.conf"
          expect_rejected "$tmp/unknown.conf" 'unknown setting NOPE'
          sed -e 's/^HOSTNAME=.*/HOSTNAME=-bad/' -e 's/^FILESYSTEM=.*/FILESYSTEM=xfs/' \
            -e 's/^EXTRA_PACKAGES=.*/EXTRA_PACKAGES=htop;reboot/' "$tmp/settings.conf" > "$tmp/values.conf"
          expect_rejected "$tmp/values.conf" 'Hostname must be'
          expect_rejected "$tmp/values.conf" 'Choose ext4 or btrfs.'
          expect_rejected "$tmp/values.conf" 'Invalid package name: htop;reboot'
          if "$installer" --dry-run 2>/dev/null; then
            echo "--dry-run without --config was accepted" >&2
            exit 1
          fi

      - name: Validate required files exist
        run: |
          set -euo pipefail
          required=(
            profile/profiledef.sh
            profile/packages.x86_64
            profile-aarch64/profiledef.sh
            profile-aarch64/packages.aarch64
            profile-aarch64/pacman.conf
            profile-aarch64/efiboot/loader/loader.conf
            profile-aarch64/efiboot/loader/entries/lukearch-aarch64.conf
            profile/pacman.conf
            profile/airootfs/etc/systemd/zram-generator.conf
            profile/airootfs/etc/nftables.conf
            profile/airootfs/etc/sddm.conf.d/autologin.conf
            profile/airootfs/etc/sudoers.d/lukearch
            profile/airootfs/usr/local/sbin/lukearch-set-admin-password
            profile-aarch64/airootfs/etc/sudoers.d/lukearch
            profile-aarch64/airootfs/usr/local/sbin/lukearch-set-admin-password
            profile/airootfs/etc/mkinitcpio.conf.d/archiso.conf
            profile/airootfs/etc/pam.d/su
            profile/airootfs/etc/locale.conf
            profile-aarch64/airootfs/etc/mkinitcpio.conf.d/archiso.conf
            profile-aarch64/airootfs/etc/udev/rules.d/71-lukearch-framebuffer-seat.rules
            profile-aarch64/airootfs/etc/pam.d/su
            profile-aarch64/airootfs/etc/locale.conf
            profile-aarch64/airootfs/etc/os-release
            profile/airootfs/root/customize_airootfs.sh
            profile/airootfs/usr/local/bin/lukearch-install
            profile-aarch64/airootfs/usr/local/bin/lukearch-install
            profile/airootfs/usr/local/bin/lukearch-install-launcher
            profile-aarch64/airootfs/usr/local/bin/lukearch-install-launcher
            profile/airootfs/usr/share/lukearch/install-packages
            profile-aarch64/airootfs/usr/share/lukearch/install-packages
            profile/airootfs/usr/share/applications/lukearch-install.desktop
            profile-aarch64/airootfs/usr/share/applications/lukearch-install.desktop
            profile/airootfs/etc/os-release
            profile/airootfs/etc/hostname
            profile/airootfs/etc/motd
            docs/arm-support.md
            STRUCTURE.md
            scripts/update-structure.sh
            scripts/build-iso.sh
            scripts/test-iso.sh
            scripts/test-virtualbox.sh
            scripts/test-install.sh
            scripts/test-install-guest.sh
            profile/airootfs/etc/pacman.d/mirrorlist
            profile/airootfs/etc/systemd/system/pacman-init.service
            profile-aarch64/airootfs/etc/systemd/system/pacman-init.service
            README.md
            DEV_HIST.md
            LICENSE
          )

          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required file: $file" >&2
              exit 1
            fi
          done

      - name: Validate low-memory profile settings
        run: |
          set -euo pipefail
          ! grep -qx 'archiso' profile/packages.x86_64
          grep -qx 'zram-generator' profile/packages.x86_64
          grep -qx 'libinput' profile/packages.x86_64
          grep -qx 'xf86-input-libinput' profile/packages.x86_64
          grep -qx 'mesa' profile/packages.x86_64
          grep -qx 'plasma-desktop' profile/packages.x86_64
          grep -qx 'sddm' profile/packages.x86_64
          grep -qx 'nftables' profile/packages.x86_64
          grep -qx 'sudo' profile/packages.x86_64
          ! grep -qx 'openssh' profile/packages.x86_64
          grep -q 'MEMORY_MB:-4096' scripts/test-iso.sh
          grep -q 'useradd --create-home' profile/airootfs/root/customize_airootfs.sh
          grep -q 'usermod --append --groups wheel' profile/airootfs/root/customize_airootfs.sh
          grep -q 'passwd --lock lukearch' profile/airootfs/root/customize_airootfs.sh
          grep -q 'passwd --lock root' profile/airootfs/root/customize_airootfs.sh
          grep -q 'systemctl enable NetworkManager.service' profile/airootfs/root/customize_airootfs.sh
          grep -q 'systemctl enable nftables.service' profile/airootfs/root/customize_airootfs.sh
          grep -q 'systemctl enable sddm.service' profile/airootfs/root/customize_airootfs.sh
          # The live images have no pacman keyring or (on x86_64) mirrors unless
          # these are in place; the installer needs both.
          for profile in profile profile-aarch64; do
            grep -qx 'systemctl enable pacman-init.service' "$profile/airootfs/root/customize_airootfs.sh"
          done
          grep -q '^Server = https://' profile/airootfs/etc/pacman.d/mirrorlist
          grep -q '%wheel ALL=(ALL:ALL) ALL' profile/airootfs/etc/sudoers.d/lukearch
          grep -q 'NOPASSWD: /usr/bin/passwd lukearch' profile/airootfs/etc/sudoers.d/lukearch
          grep -qx 'Defaults:%wheel rootpw' profile/airootfs/etc/sudoers.d/lukearch
          grep -qx 'Defaults!/usr/local/sbin/lukearch-set-admin-password !rootpw' profile/airootfs/etc/sudoers.d/lukearch
          grep -qx '%wheel ALL=(root) /usr/local/sbin/lukearch-set-admin-password' profile/airootfs/etc/sudoers.d/lukearch
          grep -q 'already set' profile/airootfs/usr/local/sbin/lukearch-set-admin-password
          grep -q '"/usr/local/sbin/lukearch-set-admin-password"\]="0:0:755"' profile/profiledef.sh
          grep -qx 'Defaults:%wheel rootpw' profile-aarch64/airootfs/etc/sudoers.d/lukearch
          grep -qx 'Defaults!/usr/local/sbin/lukearch-set-admin-password !rootpw' profile-aarch64/airootfs/etc/sudoers.d/lukearch
          grep -q 'already set' profile-aarch64/airootfs/usr/local/sbin/lukearch-set-admin-password
          grep -q '"/usr/local/sbin/lukearch-set-admin-password"\]="0:0:755"' profile-aarch64/profiledef.sh
          grep -q 'Security notes' README.md
          grep -q 'Power-user administration' DEV_HIST.md
          ! grep -Eq '^(nvidia|xf86-video-amdgpu|xf86-video-intel)$' profile/packages.x86_64
          grep -q 'Hardware drivers' README.md

      - name: Validate installer settings
        run: |
          set -euo pipefail
          for profile in profile profile-aarch64; do
            installer="$profile/airootfs/usr/local/bin/lukearch-install"
            packages="$profile/airootfs/usr/share/lukearch/install-packages"
            if [[ "$profile" == "profile" ]]; then
              live_packages="profile/packages.x86_64"
            else
              live_packages="profile-aarch64/packages.aarch64"
            fi
            grep -qx 'DisableDownloadTimeout' "$profile/pacman.conf"
            grep -q 'systemd.firstboot=off' "$installer"
            grep -q 'Defaults:%wheel rootpw' "$installer"
            grep -q 'sd-encrypt' "$installer"
            grep -q 'LUKS2' "$installer"
            grep -q -- '--print-config' "$installer"
            grep -q -- '--dry-run' "$installer"
            grep -q 'pacstrap -K' "$installer"
            grep -q 'device_in_use' "$installer"
            grep -q 'keyring_ready' "$installer"
            grep -q -- '--defaultno' "$installer"
            grep -qx 'Exec=konsole -e /usr/local/bin/lukearch-install-launcher' "$profile/airootfs/usr/share/applications/lukearch-install.desktop"
            grep -q 'lukearch-install-launcher"\]="0:0:755"' "$profile/profiledef.sh"
            grep -qx '%wheel ALL=(root) NOPASSWD: /usr/local/sbin/lukearch-set-admin-password --status' "$profile/airootfs/etc/sudoers.d/lukearch"
            grep -q 'lukearch-install' "$profile/profiledef.sh"
            grep -q 'Desktop/lukearch-install.desktop' "$profile/airootfs/root/customize_airootfs.sh"
            ! grep -qx 'archiso' "$packages"
            ! grep -qx 'mkinitcpio-archiso' "$packages"
            for pkg in plasma-desktop sddm networkmanager nftables sudo cryptsetup btrfs-progs zram-generator linux-firmware discover; do
              grep -qx "$pkg" "$packages"
            done
            # Discover's backend: PackageKit on x86_64, Flatpak on ARM64, where KDE
            # recommends against PackageKit.
            if [[ "$profile" == "profile" ]]; then
              grep -qx 'packagekit-qt6' "$packages"
            else
              grep -qx 'flatpak' "$packages"
              ! grep -qx 'packagekit-qt6' "$packages"
            fi
            for pkg in arch-install-scripts dialog cryptsetup; do
              grep -qx "$pkg" "$live_packages"
            done
          done

      - name: Validate ARM64 VirtualBox profile
        run: |
          set -euo pipefail
          grep -qx "arch='aarch64'" profile-aarch64/profiledef.sh
          grep -qx 'linux-aarch64' profile-aarch64/packages.aarch64
          grep -qx "bootmodes=('uefi.systemd-boot')" profile-aarch64/profiledef.sh
          grep -q 'ARCH:-x86_64' scripts/build-iso.sh
          grep -q 'profile-aarch64' scripts/build-iso.sh
          grep -q 'VirtualBox 7.2+' scripts/test-virtualbox.sh
          grep -q -- '--platform-architecture arm' scripts/test-virtualbox.sh
          grep -q 'armv8virtual' scripts/test-virtualbox.sh
          grep -q 'usbtablet' scripts/test-virtualbox.sh
          ! grep -q 'ArchLinux_64' scripts/test-virtualbox.sh

      - name: Check STRUCTURE.md tree is current
        run: |
          set -euo pipefail
          bash scripts/update-structure.sh
          if ! git diff --exit-code -- STRUCTURE.md; then
            echo "STRUCTURE.md tree is out of date. Run scripts/update-structure.sh and commit the result." >&2
            exit 1
          fi

      - name: Require README and development history updates
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$BASE_SHA"
            head_sha="$HEAD_SHA"
          else
            base_sha="$BEFORE_SHA"
            head_sha="$CURRENT_SHA"
          fi

          if [[ "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            echo "No prior revision is available; skipping documentation-change enforcement."
            exit 0
          fi

          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          if [[ -z "$changed_files" ]]; then
            echo "No files changed."
            exit 0
          fi

          if ! grep -qx 'README.md' <<<"$changed_files"; then
            echo "README.md must be updated with every repository change." >&2
            exit 1
          fi

          if ! grep -qx 'DEV_HIST.md' <<<"$changed_files"; then
            echo "DEV_HIST.md must be updated with every repository change." >&2
            exit 1
          fi
