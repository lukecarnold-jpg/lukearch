name: Build x86_64 ISO

# Builds the x86_64 live ISO in an Arch Linux container, so package renames and
# profile mistakes are caught before a release. The ARM64 profile needs an ARM64
# Linux host and is built by hand (see docs/arm-support.md).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'profile/**'
      - 'scripts/build-iso.sh'
      - '.github/workflows/build-iso.yml'
  push:
    branches: [main]
    paths:
      - 'profile/**'
      - 'scripts/build-iso.sh'
      - '.github/workflows/build-iso.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # The work directory and the ISO need about 10 GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the ISO with mkarchiso
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          # mkarchiso needs loop devices and mounts, so the container is privileged.
          # The repository is copied inside the container, which keeps WORK_DIR on
          # a case-sensitive filesystem.
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/src:ro \
            -v "$RUNNER_TEMP/out":/out \
            archlinux:latest bash -c '
              set -euo pipefail
              echo DisableSandbox >> /etc/pacman.conf
              pacman -Syu --noconfirm --needed archiso
              cp -a /src /repo
              cd /repo
              ARCH=x86_64 WORK_DIR=/work OUT_DIR=/out ./scripts/build-iso.sh < <(yes)
            '
          ls -la "$RUNNER_TEMP/out"
          cd "$RUNNER_TEMP/out"
          sha256sum ./*.iso | tee SHA256SUMS

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: lukearch-x86_64-iso
          path: |
            ${{ runner.temp }}/out/*.iso
            ${{ runner.temp }}/out/SHA256SUMS
          retention-days: 7
          compression-level: 0
